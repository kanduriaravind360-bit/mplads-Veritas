# eSAKSHI district spellings -> district names in the boundary file used by the
# Risk Map (datta07/INDIAN-SHAPEFILES). Keyed by state, because district names
# repeat across states (Aurangabad, Bilaspur, Balrampur, Raigarh, Bijapur ...) and
# a national alias table would silently move a district into the wrong state.
#
# Both sides are normalised with backend.app.geo.normalise_district (upper case,
# accents transliterated, punctuation to spaces). Read by backend.app.geo.map_key
# and by scripts/build_district_geojson.py for its match report.
#
# Renamed or recently created districts are mapped to the boundary they sit in
# on the older map; those lines say so.

